# Alembic configuration file
# Used by: alembic upgrade head / alembic revision --autogenerate

[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# Set the database URL — reads from environment at runtime via env.py
# sqlalchemy.url is intentionally left blank here; env.py overrides it.
sqlalchemy.url =

[post_write_hooks]
# hooks = black  (enable once black is confirmed on PATH inside poetry env)

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
