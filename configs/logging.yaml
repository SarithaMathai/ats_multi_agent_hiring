version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s %(funcName)s %(lineno)d"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file_app:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/ats_app.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

  file_agents:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/ats_agents.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

root:
  level: WARNING
  handlers: [console]

loggers:
  ats:
    level: INFO
    handlers: [console, file_app]
    propagate: false

  ats.agents:
    level: DEBUG
    handlers: [console, file_agents]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false

  chromadb:
    level: WARNING
    handlers: [console]
    propagate: false
