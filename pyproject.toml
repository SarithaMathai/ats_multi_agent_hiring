[tool.poetry]
name = "ats-multi-agent-hiring"
version = "0.1.0"
description = "ATS AI-Powered Multi-Agent Hiring System — Retrieval-Augmented Insights with 8 Specialized Agents"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "app" },
    { include = "agents" },
    { include = "orchestration" },
    { include = "ingestion" },
    { include = "rag" },
    { include = "vector_store" },
    { include = "database" },
    { include = "shared" },
    { include = "mcp_platform" },
    { include = "configs" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
python-multipart = "^0.0.20"

# Data validation & settings
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# Database (PostgreSQL)
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"

# Vector store
chromadb = "^0.5.20"

# LLM & Embeddings
openai = "^1.30.0"
sentence-transformers = "^3.3.0"

# Agent orchestration
langgraph = "^0.2.50"

# Caching & messaging
redis = { extras = ["hiredis"], version = "^5.2.0" }

# HTTP client
httpx = "^0.27.0"

# Resilience
tenacity = "^9.0.0"

# Env & config
python-dotenv = "^1.0.0"

# Logging & observability
structlog = "^24.4.0"
python-json-logger = "^2.0.7"

# Data processing
pandas = "^2.2.0"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
black = "^24.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
faker = "^30.0.0"

[tool.poetry.scripts]
ats-server = "app.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Tool configuration ─────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-report=html"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
